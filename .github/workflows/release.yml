name: Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Validate version and test
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          uv sync --locked --group build
          uv run python -c "import os, tomllib; from hots_draft._version import VERSION; assert 'v'+VERSION == os.environ['GITHUB_REF_NAME']; assert tomllib.load(open('pyproject.toml','rb'))['project']['version'] == VERSION"
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q
      - name: Build executable
        run: uv run --group build hots-build
      - name: Verify executable and checksum
        shell: pwsh
        run: |
          $probe = Start-Process -FilePath "$pwd/dist/HotsDraft.exe" -ArgumentList '--help' -WindowStyle Hidden -PassThru
          if (-not $probe.WaitForExit(30000)) { throw 'Executable startup timed out' }
          $probe.Refresh()
          if ($probe.ExitCode -ne 0) { throw "Executable startup failed: $($probe.ExitCode)" }
          $bundleProbe = Start-Process -FilePath "$pwd/dist/HotsDraft.exe" -ArgumentList '--check-bundle', '--data-dir', "$pwd/build/clean-host-data" -WindowStyle Hidden -PassThru
          if (-not $bundleProbe.WaitForExit(30000)) { throw 'Bundle validation timed out' }
          $bundleProbe.Refresh()
          if ($bundleProbe.ExitCode -ne 0) { throw 'Bundle validation failed' }
          $digest = (Get-FileHash dist/HotsDraft.exe -Algorithm SHA256).Hash.ToLower()
          "$digest  HotsDraft.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/HotsDraft.exe dist/SHA256SUMS.txt --verify-tag --generate-notes --latest --title "HotsDraft $env:GITHUB_REF_NAME"
